name: Deploy SDK

on:
  release:
    types:
      - published

jobs:
  deploy:
    name: Deploy SDK to Rubygems
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set Release Version
        run: |
          RELEASE_VERSION=${TAG#v}
          re=[0-9]+\.[0-9]+\.[0-9]+
          if [[ $RELEASE_VERSION =~ $re ]]; then
            echo "GEM_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          else
            echo "Tag does not match expected semver regex pattern (v$re)"
            echo $RELEASE_VERSION
            echo 'Please update your tag to match the expected regex pattern'
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0

      - name: Update Gem Version
        run: sed -i "s/VERSION = '.*'/VERSION = '$GEM_VERSION'/g" lib/bandwidth-sdk/version.rb

      - name: Install Packages and Test
        run: |
          npm install -g @stoplight/prism-cli
          bundle install
          prism mock ./bandwidth.yml & (sleep 3; rake unit)
        shell: bash

      - name: Configure Rubygems Trusted Publishing Credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Deploy to Rubygems
        run: |
          gem build *.gemspec
          gem push *.gem

      - uses: Bandwidth/build-notify-slack-action@v2
        if: always()
        with:
          job-status: ${{ job.status }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
